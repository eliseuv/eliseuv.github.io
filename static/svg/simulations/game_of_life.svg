<?xml version="1.0" ?>
<svg width="800px" height="800px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- A glider: alive cells filled, dead cells faint, since the CSS mask reads alpha -->
  <defs>
    <style>.a{fill:#000000;stroke:#000000;stroke-linejoin:round;stroke-width:1.5px;}.d{fill:none;stroke:#000000;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.5px;opacity:0.3;}</style>
  </defs>
  <rect class="d" x="2.5" y="2.5" width="5" height="5" rx="0.5"/>
  <rect class="a" x="9.5" y="2.5" width="5" height="5" rx="0.5"/>
  <rect class="d" x="16.5" y="2.5" width="5" height="5" rx="0.5"/>
  <rect class="d" x="2.5" y="9.5" width="5" height="5" rx="0.5"/>
  <rect class="d" x="9.5" y="9.5" width="5" height="5" rx="0.5"/>
  <rect class="a" x="16.5" y="9.5" width="5" height="5" rx="0.5"/>
  <rect class="a" x="2.5" y="16.5" width="5" height="5" rx="0.5"/>
  <rect class="a" x="9.5" y="16.5" width="5" height="5" rx="0.5"/>
  <rect class="a" x="16.5" y="16.5" width="5" height="5" rx="0.5"/>
</svg>
