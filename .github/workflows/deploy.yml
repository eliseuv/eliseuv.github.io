name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ] 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed by cache-nix-action to purge superseded caches.
      actions: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # wrangler at the pinned nixpkgs isn't in cache.nixos.org, so without
      # this every run rebuilds it from source (~10 min). No GC before saving:
      # nothing is rooted after `nix run`, so a size cap would evict exactly
      # the paths worth keeping, and purging keeps only one cache version.
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build WASM Simulations
        run: nix run .#simulations

      - name: Build Resume
        run: nix run .#resume
        env:
          RESUME_PHONE: ${{ secrets.RESUME_PHONE }}

      - name: Build Zola Site
        run: nix run .#zola
        env:
          RESUME_PHONE: ${{ secrets.RESUME_PHONE }}

      - name: Deploy to Cloudflare Pages
        run: nix run .#deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
