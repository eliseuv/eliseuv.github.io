[package]
name = "spectral_criticality"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Native generator of the precomputed reference scans (`gen_reference`).
generate = []

[[bin]]
name = "gen_reference"
required-features = ["generate"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1.7"
artificial-systems = { workspace = true, features = ["analysis"] }
getrandom.workspace = true
ndarray = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"
flate2 = "1.1"
