[workspace]
resolver = "2"
members = [
    "game_of_life",
    "ising_2d",
    "contact_process",
    "chiarella",
    "tsp_annealing",
    "annealing",
    "quant",
]
# Git submodule consumed as a path dependency; excluded so cargo doesn't adopt
# it as a member (which would override its own profiles and features).
exclude = ["artificial-systems"]

[workspace.dependencies]
artificial-systems = { path = "artificial-systems", default-features = false }
# rand's OS entropy source has no default backend on wasm32-unknown-unknown;
# this routes it to the browser's crypto.getRandomValues.
getrandom = { version = "0.4", features = ["wasm_js"] }

# Per-member overrides below don't reach dependency crates
# (artificial-systems, rand, ...); "*" covers them.
[profile.release.package."*"]
opt-level = "s"

[profile.release.package.game_of_life]
opt-level = "s"

[profile.release.package.ising_2d]
opt-level = "s"

[profile.release.package.contact_process]
opt-level = "s"

[profile.release.package.chiarella]
opt-level = "s"

[profile.release.package.tsp_annealing]
opt-level = "s"
