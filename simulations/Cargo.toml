[workspace]
resolver = "2"
members = [
    "spinning_cube",
    "game_of_life",
    "ising_2d",
    "artificial_systems_wasm",
    "contact_process",
    "chiarella",
    "tsp_annealing",
]
# Git submodule consumed as a path dependency; excluded so cargo doesn't adopt
# it as a member (which would override its own profiles and features).
exclude = ["artificial-systems"]

# spinning_cube's own code is tiny; its size is almost entirely bevy's
# dependency tree, which a per-crate override on "spinning_cube" alone
# doesn't touch. "*" covers every dependency crate too.
[profile.release.package."*"]
opt-level = "s"

[profile.release.package.game_of_life]
opt-level = "s"

[profile.release.package.ising_2d]
opt-level = "s"

[profile.release.package.contact_process]
opt-level = "s"

[profile.release.package.chiarella]
opt-level = "s"

[profile.release.package.tsp_annealing]
opt-level = "s"
