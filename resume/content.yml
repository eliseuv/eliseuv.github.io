projects:
  - name: tsp-sa
    repo: eliseuv/tsp-sa
    context: msc
    skills:
      - name: C++
      - name: Python
    points:
      - Built a modular C++ optimization library implementing Simulated Annealing for the M.Sc. research
      - Supports Generalized Simulated Annealing and Tsallis Entropy statistics
      - Decoupled the optimization core from the TSP implementation, enabling reuse across arbitrary Markov chain problems
      - Automated data analysis and plotting in Python to accelerate research iteration

  - name: artificial-systems
    repo: eliseuv/artificial-systems
    context: phd
    skills:
      - name: Rust
        libs: ["ndarray", "serde"]
    points:
      - Implemented high-performance Rust simulations of computational models for the Ph.D. research
      - Modeled Spin Systems (Ising and Blume-Capel models) at scale
      - Investigated the Contact Process with diffusion

  - name: ts-cov-matrix
    repo: eliseuv/ts-cov-matrix
    context: phd
    skills:
      - name: Julia
        libs: ["DataFrames.jl", "Makie.jl"]
    points:
      - Applied Random Matrix Theory to analyze time-series covariance matrices for the Ph.D. research
      - Compared spectral properties against the Marchenko-Pastur distribution across NOAA temperature records, Spin Systems, and Contact Processes
      - Built a full data analysis pipeline in the Julia ecosystem (DataFrames.jl, Makie.jl)

  - name: json-parser
    repo: eliseuv/json-parser
    skills:
      - name: Haskell
    points:
      - Strict JSON parser implemented in Haskell using Megaparsec
      - Adheres closely to JSON standards
      - Can be used as a library or a standalone command-line tool

  - name: sternhalma-server
    repo: eliseuv/sternhalma-server
    skills:
      - name: Rust
        libs: ["tokio"]
    points:
      - Asynchronous game server for Sternhalma (Chinese Checkers) built with Rust and Tokio
      - Actor-like architecture with decoupled game logic and connection handling
      - Client-agnostic design supporting CLI, GUI, and AI agents
      - Supports both Raw TCP and WebSocket connections using a CBOR-based protocol

  - name: sternhalma-agent (WIP)
    repo: eliseuv/sternhalma-agent
    skills:
      - name: Python
        libs: ["PyTorch"]
    points:
      - Reinforcement learning agent implementing AlphaZero from scratch
      - Uses Monte Carlo Tree Search (MCTS) for planning and Deep Neural Networks (ResNet) for evaluation
      - Designed to master Sternhalma through self-play without human knowledge

