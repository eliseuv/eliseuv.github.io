      repo: eliseuv/dotfiles
      skills: [NixOS]
      description: My dotfiles repository containing my personal configuration for multiple hosts.
    - name: Neovim
      repo: eliseuv/nvim
      skills: [Neovim]
      description: My Neovim configuration using [LazyVim](https://github.com/LazyVim/LazyVim).
    - name: DOOM Emacs
      repo: eliseuv/doom-emacs
      skills: [GNU Emacs]
      description: My [DOOM Emacs](https://github.com/emacs-doom/doom-emacs) configuration.

  featured:
    - title: Computational Physics
      emoji: "⚛️"
      description: Projects applying physical laws and rigorous math to solve complex problems.
      projects:
        - repo: eliseuv/tsp-sa
          headline: High-performance Simulated Annealing in C++
          description: Implementation of stochastic optimization algorithms to find global minima in combinatorial problems.
        - repo: eliseuv/artificial-systems
          headline: High-performance Complex Systems Simulation in Rust
          description: Modeling artificial environments to study emergent behavior and system dynamics.
        - repo: eliseuv/ts-cov-matrix
          headline: Time Series Random Matrix Analysis
          description: Tools for analyzing correlations in time-series data, drawing on concepts from Random Matrix Theory.

    - title: "Sternhalma Suite: Full Stack Game & AI"
      emoji: "🧠"
      description: A complete implementation of the Sternhalma (Chinese Checkers) game, featuring a backend server, web frontend, and an autonomous playing agent.
      projects:
        - repo: eliseuv/sternhalma-server
          label: Game Server
          description: The backend logic handling game state and multiplayer connections.
        - repo: eliseuv/sternhalma-web
          label: Web Interface
          skills: [React]
          description: The interactive frontend interface for the game.
        - repo: eliseuv/sternhalma-agent
          label: RL Agent
          description: An AI agent trained to play the game using Reinforcement Learning.

    - title: Systems
      emoji: "🔧"
      projects:
        - repo: eliseuv/json-parser
          headline: Simple JSON Parser.
          description: A from-scratch implementation of a JSON parser, built to better understand parser combinators.
        - repo: eliseuv/web-watcher
          skills: [Python]
          headline: Website Monitoring Tool
          description: Simple tool to monitor a list of websites for changes.

