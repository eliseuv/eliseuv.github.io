# GitHub profile README (readme/README.md.j2). Not read by the resume or the site.
# Featured projects that exist under `projects` are matched by `repo` and take their
# skills from there; the rest declare their own.
profile:
  intro: |
    I stand at the intersection of **Physics** and **Computer Science**.
    My background is in **Statistical Computational Physics** with a focus on **Complex Systems**, **Stochastic Optimization** and **Random Matrix Theory**.
    My interests extend from **Data Science** to **Software Engineering** with projects in **Time Series Analysis**, **Reinforcement Learning** and **Full-Stack Development**.

  # Skill name -> simple-icons slug (https://simpleicons.org). Unlisted names get no logo.
  badges:
    C: c
    C++: c++
    C++17: c++
    boost: c++
    Rust: rust
    tokio: tokio
    rayon: rust
    faer: rust
    ndarray: rust
