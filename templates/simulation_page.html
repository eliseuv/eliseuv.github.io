{% extends "base.html" %}

{% block content %}

<article class="post-container">

    <header class="post-header">
        <div class="breadcrumbs">
            <a href="/simulations">..</a>/{{ page.slug }}
        </div>

        <h1 class="glitch-text">{{ page.title }}</h1>

        <div class="post-meta">
            <span>// DATE: {{ page.date | date(format="%Y-%m-%d") }}</span>
        </div>
    </header>

    <hr>

    <div class="post-content">
        {{ page.content | safe }}
    </div>

    <footer class="post-footer">
        <p>EOF</p>
    </footer>

</article>

{% endblock content %}
