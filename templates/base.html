<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
    <link rel="me" href="https://hachyderm.io/@evf">

    {% block head_extra %}{% endblock head_extra %}

</head>

<body class="{% block body_class %}{% endblock body_class %}">


    <div id="transition-overlay" class="active">
    </div>

    <header>
        <nav>
            <a href="/">[Resume]</a>
            <a href="/simulations">[Simulations]</a>
            <a href="/blog">[Notes]</a>
        </nav>
        <hr>
    </header>

    <main>

        {% block content %}{% endblock content %}

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('transition-overlay');

            // Reveal page on load
            setTimeout(() => {
                overlay.classList.remove('active');
                overlay.classList.add('hidden');
                document.querySelector('main').classList.add('content-enter');
            }, 50); // Start fade out almost immediately

            // Handle internal links
            document.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', (e) => {
                    const href = link.getAttribute('href');

                    // Filter out external links, anchors, or new tabs
                    if (!href || href.startsWith('#') || link.target === '_blank' || href.startsWith('http') && !href.includes(window.location.hostname)) {
                        return;
                    }

                    // Same-page anchors like "/#entry-phd" only change the hash, so the
                    // overlay would never be hidden by a new page load
                    if (link.hash && link.pathname === window.location.pathname) {
                        return;
                    }

                    e.preventDefault();
                    overlay.classList.remove('hidden');
                    overlay.classList.add('active');

                    // Navigate immediately
                    setTimeout(() => {
                        window.location.href = href;
                    }, 0);
                });
            });
        });

        // Resume entries and the skill map are collapsed, which :target does not undo
        function revealHashTarget() {
            const id = decodeURIComponent(window.location.hash.slice(1));
            const target = id && document.getElementById(id);
            if (!target) return;

            const details = target.closest('details');
            if (details) details.open = true;
            // The skill map stays hidden behind the resume skill chips until one is followed
            const skills = target.closest('.skills-section');
            if (skills) skills.classList.add('expanded');

            target.scrollIntoView({ block: 'start' });
            target.classList.remove('link-target-flash');
            void target.offsetWidth; // Restart the animation on repeated visits
            target.classList.add('link-target-flash');
        }
        document.addEventListener('DOMContentLoaded', revealHashTarget);
        window.addEventListener('hashchange', revealHashTarget);

        // Ensure overlay is hidden when navigating back
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                const overlay = document.getElementById('transition-overlay');
                overlay.classList.remove('active');
                overlay.classList.add('hidden');
            }
        });
    </script>
</body>

</html>
