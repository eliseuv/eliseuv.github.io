<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Moved to eliseuv.dev</title>
  <!-- GitHub Pages can't send a real 301, so the path is carried over in JS;
       the meta refresh is the no-JS fallback and can only reach the root. -->
  <script>
    location.replace("https://eliseuv.dev" + location.pathname + location.search + location.hash);
  </script>
  <meta http-equiv="refresh" content="0; url=https://eliseuv.dev/">
  <link rel="canonical" href="https://eliseuv.dev/">
  <meta name="robots" content="noindex">
</head>
<body>
  <p>This site has moved to <a href="https://eliseuv.dev/">eliseuv.dev</a>.</p>
</body>
</html>
